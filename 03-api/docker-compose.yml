services:
  backend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
    command: node server.js

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ../02-spa/frontend/dist:/usr/share/nginx/html:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
